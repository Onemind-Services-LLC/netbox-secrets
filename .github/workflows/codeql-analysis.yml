name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '24 4 * * 5'

# Add concurrency group to control job running
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: Onemind-Services-LLC/actions/.github/workflows/codeql-analysis.yml@8ba8dea9401b08db920340ab52a47a0b3dd6e8d2
    with:
      runs-on: ubuntu-22.04-sh
      languages: ${{ matrix.language }}
