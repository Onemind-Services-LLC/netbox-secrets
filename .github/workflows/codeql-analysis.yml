name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '24 4 * * 5'

# Add concurrency group to control job running
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: Onemind-Services-LLC/actions/.github/workflows/codeql-analysis.yml@d44af503e3f1bd61435617830a7c604c047dc408
    with:
      runs-on: ci-build
      languages: ${{ matrix.language }}
