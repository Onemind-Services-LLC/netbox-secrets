name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '24 4 * * 5'

# Add concurrency group to control job running
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    uses: Onemind-Services-LLC/actions/.github/workflows/codeql-analysis.yml@7a5df58704eb175a5f377e0cb3d5172465977932
    with:
      runs-on: ubuntu-22.04-sh
      app-id: ${{ vars.APP_ID }}
      languages: ${{ matrix.language }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
