name: CI

on:
  push: { }
  pull_request: { }

# Add concurrency group to control job running
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    permissions:
      contents: read
      pull-requests: write
    uses: Onemind-Services-LLC/actions/.github/workflows/netbox-plugin-tests.yml@554e9d3e621233e8153051ea3200ad7cd95ea5b8
    with:
      lint-runs-on: ci-small
      runs-on: ci-test
      plugin-name: 'netbox_secrets'
      netbox-version: v4.6.1
      coverage-minimum: 100
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
